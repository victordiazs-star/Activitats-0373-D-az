<h1>Crear un compte</h1>

<form>
    <label for="nom">Nom:</label>
    <input
        type="text"
        id="nom"
        name="nom"
        placeholder="Escriu el teu nom"
        required>

    <br><br>

    <label for="correu">Correu electrònic:</label>
    <input
        type="email"
        id="correu"
        name="correu"
        placeholder="Escriu el teu correu"
        required>

    <br><br>

    <label for="contrasenya">Contrasenya:</label>
    <input
        type="password"
        id="contrasenya"
        name="contrasenya"
        placeholder="Escriu una contrasenya"
        required>

    <br><br>

    <input
        type="checkbox"
        id="termes"
        name="termes"
        required>
    <label for="termes">Accepto els termes i condicions</label>

    <br><br>

    <button type="submit">Registrar-me</button>
</form>
